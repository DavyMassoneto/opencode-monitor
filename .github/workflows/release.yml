name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - id: next
        run: |
          bumped="$(npx git-cliff --bumped-version)"
          if [ "$bumped" = "v$(node -p "require('./package.json').version")" ]; then
            echo "Nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$bumped" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.next.outputs.release == 'true'
        run: |
          npm version "${{ steps.next.outputs.tag }}" --no-git-tag-version
          npx git-cliff --tag "${{ steps.next.outputs.tag }}" --output CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.next.outputs.tag }} [skip ci]"
          git tag "${{ steps.next.outputs.tag }}"
      - if: steps.next.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::O segredo NPM_TOKEN não está configurado."
            exit 1
          fi
          umask 077
          export NPM_CONFIG_USERCONFIG="$(mktemp "$RUNNER_TEMP/npmrc.XXXXXX")"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          npm publish --access public --registry https://registry.npmjs.org/
      - if: steps.next.outputs.release == 'true'
        run: git push origin HEAD:main "${{ steps.next.outputs.tag }}"
      - if: steps.next.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx git-cliff --latest --strip header --output notes.md
          gh release create "${{ steps.next.outputs.tag }}" --title "${{ steps.next.outputs.tag }}" \
            --notes-file notes.md --latest --verify-tag
